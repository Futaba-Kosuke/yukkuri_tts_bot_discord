[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
python-dotenv = "^0.20.0"
py-cord = {version = "2.4.1", extras = ["voice"]}

[poetry.group.dev.dependencies]
isort = "^5.10.1"
black = "^22.3.0"
flake8 = "^4.0.1"
mypy = "^0.910"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
